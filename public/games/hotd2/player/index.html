<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOTD2 Recompiled</title>
<style>
	:root { --bg: #0b0b0d; --fg: #e8e6e3; --muted: #8a8780; --accent: #c8322a; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
	main { max-width: 960px; margin: 0 auto; padding: 16px; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	p.sub { margin: 0 0 12px; color: var(--muted); }
	#stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; }
	canvas { width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: auto; }
	#overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
	#overlay[hidden] { display: none; }
	.picker { display: grid; gap: 10px; justify-items: center; }
	button { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; font: inherit; cursor: pointer; }
	#stats { margin-top: 8px; color: var(--muted); font: 12px ui-monospace, monospace; }
	#log { margin-top: 8px; height: 140px; overflow: auto; font: 12px/1.35 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
	kbd { border: 1px solid #444; padding: 0 4px; border-radius: 3px; }
	#stage:fullscreen { display: grid; place-items: center; background: #000; }
	#stage:fullscreen canvas { width: min(100vw, calc(100vh * 4 / 3)); height: auto; aspect-ratio: 4 / 3; }
	.bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 8px; }
	.bar button { padding: 4px 10px; font-size: 12px; }

	/* Touch Mobile Overlay */
	#touch-controls {
		position: absolute;
		inset: 0;
		pointer-events: none;
		z-index: 10;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: 12px;
	}
	.touch-top-bar {
		display: flex;
		justify-content: space-between;
		pointer-events: auto;
	}
	.touch-btn {
		background: rgba(20, 20, 25, 0.75);
		color: #fff;
		border: 1px solid rgba(255, 255, 255, 0.3);
		padding: 8px 14px;
		font-family: monospace;
		font-size: 12px;
		font-weight: bold;
		border-radius: 6px;
		touch-action: manipulation;
		cursor: pointer;
		user-select: none;
		backdrop-filter: blur(4px);
	}
	.touch-btn:active {
		background: var(--accent);
		border-color: #fff;
	}
	.touch-bottom-bar {
		display: flex;
		justify-content: flex-end;
		pointer-events: auto;
	}
	#btn-reload {
		background: rgba(200, 50, 42, 0.85);
		border: 2px solid #ff4444;
		color: #fff;
		padding: 14px 28px;
		font-size: 16px;
		font-weight: 900;
		border-radius: 8px;
		box-shadow: 0 4px 12px rgba(200, 50, 42, 0.5);
	}
	#btn-reload:active {
		background: #ff2222;
		transform: scale(0.96);
	}
</style>
</head>
<body>
<main>
	<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
		<a href="/" style="color: #00ff66; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid #00ff66; padding: 4px 10px; border-radius: 4px;">◀ BACK TO ARCADE</a>
		<span style="color: #8a8780; font-size: 12px; font-family: monospace;">HOTD2 RECOMPILED · GPL-2.0</span>
	</div>
	<h1>The House of the Dead 2 — recompiled</h1>
	<p class="sub">Mouse = gun (left button fires, right button reloads) · <kbd>5</kbd> coin, then <kbd>1</kbd> or <kbd>Enter</kbd> start · <kbd>9</kbd> test (<kbd>0</kbd> service) · <kbd>F</kbd> fullscreen</p>
	<div id="stage">
		<canvas id="screen" width="640" height="480"></canvas>
		<div id="touch-controls" hidden>
			<div class="touch-top-bar">
				<div style="display:flex; gap:8px;">
					<button id="btn-coin" class="touch-btn">COIN (5)</button>
					<button id="btn-start" class="touch-btn">START (1)</button>
				</div>
				<button id="btn-sound" class="touch-btn">🔊 SOUND</button>
			</div>
			<div class="touch-bottom-bar">
				<button id="btn-reload" class="touch-btn">RELOAD</button>
			</div>
		</div>
		<div id="overlay">
			<div class="picker">
				<div>Load your own <b>hotd2.zip</b> (NAOMI set). It stays in this browser.</div>
				<input type="file" id="rom" accept=".zip">
				<button id="dev" hidden>Use local dev ROM</button>
			</div>
		</div>
	</div>
	<div class="bar"><div id="stats"></div><button id="fullscreen" hidden>Fullscreen</button></div>
	<div id="log"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
